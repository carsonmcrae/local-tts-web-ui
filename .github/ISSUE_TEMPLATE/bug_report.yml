name: Bug report
description: Something doesn't work as expected
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't attach private documents or voice recordings** — describe them instead.
        For security issues, use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste Settings → About → "Copy diagnostics", or the output of `npm run doctor`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Setup / npm run dev,
          Library & uploads,
          Reader & playback,
          Voices,
          Voice Studio,
          Export,
          Settings,
          Other,
        ]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 130 on Ubuntu 24.04
