name: Feature request
description: Suggest an improvement
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project
      options:
        - label: Works fully offline and keeps documents/recordings on this computer
        - label: Uses permissively licensed code and model weights
