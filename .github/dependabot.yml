# Purpose: Automated dependency update proposals with a supply-chain cool-down.
# Scope: npm (root workspace), the server and worker uv projects, and GitHub Actions.
# Does NOT belong: Auto-merging — every update is reviewed and tested (docs/security/supply-chain.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/chatterbox-worker
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
    ignore:
      # setuptools 81+ removes pkg_resources, which the Perth watermarker imports; without it model
      # loading fails. Its one advisory is unreachable here (docs/security/supply-chain.md).
      - dependency-name: setuptools
        versions: ['>=81']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
