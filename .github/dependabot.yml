# Purpose: Automated dependency update proposals with a supply-chain cool-down.
# Scope: npm (root workspace), the server and worker uv projects, and GitHub Actions.
# Does NOT belong: Auto-merging — every update is reviewed and tested (docs/security/supply-chain.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10: eslint-plugin-jsx-a11y (6.10.2, the latest) supports ESLint 9 at most, so the major
      # upgrade would mean dropping accessibility linting. Revisit when it supports ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Node's types follow the runtime this project targets (.nvmrc, engines), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/chatterbox-worker
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
