# Purpose: Categories for GitHub's automatically generated release notes ("Generate release notes").
# Scope: Groups merged pull requests by label. The release workflow uses the CHANGELOG entry as the main
#   notes; this keeps the generated pull request list readable when it's used.
# Does NOT belong: Release publishing (.github/workflows/release.yml).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
