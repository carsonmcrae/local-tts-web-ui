# Purpose: Block pull requests that add dependencies with known high-severity vulnerabilities.
# Scope: Manifest and lockfile changes in pull requests. Runs on every pull request (it passes at once
#   when no dependency changed) because "review" is a required check: a path filter would leave
#   pull requests without dependency changes waiting for a check that never runs.
# Does NOT belong: Full audits (ci.yml security job).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
