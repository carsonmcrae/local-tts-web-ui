# Purpose: Build and test the Windows desktop app on a clean Windows runner, for every change to it.
# Scope: The desktop shell's formatting, lints, unit tests and cargo-deny (advisories, licences,
#   sources for the Windows build); beside them the full installer (web UI, bundled
#   runtime with the verified Kokoro model, per-user NSIS installer) built WITHOUT the release updater
#   key, an installer smoke test (silent install, speech, MP3 export, no console windows, restart,
#   uninstall that keeps the user's data), everything a person did surviving a close and a crash
#   (persistence-test.mjs), the installer kept as a workflow artifact for manual testing,
#   and the update path between two builds signed with a throwaway key (scripts/desktop/update-test.mjs),
#   with both builds running at the same time; the Microsoft Store package (MSIX, test identity) too.
#   Nothing is published, signed with the release key or attached to a release.
# Does NOT belong: Publishing releases (release.yml) or the cross-platform server tests (ci.yml).
name: Desktop

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/desktop/**'
      - 'scripts/lib/**'
      - 'brand/svg/ttsnative-app-icon.svg' # the Store package's logos
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  LTTS_UV_PINNED_ONLY: '1'
  UV_LINK_MODE: copy
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  # The installer and update tests drive the window through WebView2's debugging port, which only a
  # build with the test-hooks feature can open (never a release build; release.yml leaves this unset).
  TTSNATIVE_TEST_HOOKS: '1'

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Desktop shell (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 30 # catches a hung job; real runs take 1-8 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache-name: shell
      - name: Placeholder runtime (the installer job assembles the real one)
        run: mkdir -p apps/desktop/runtime && echo placeholder > apps/desktop/runtime/README.txt
      - name: Formatting
        working-directory: apps/desktop/src-tauri
        run: |
          if ! cargo fmt --check; then
            cargo fmt && git diff > "$RUNNER_TEMP/rustfmt.patch"
            echo "::error::cargo fmt changed files; the rustfmt-patch artifact has the fix"
            exit 1
          fi
      - name: Rust advisories, licences and sources (cargo-deny, Windows build)
        working-directory: apps/desktop/src-tauri
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz
          echo "975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum --check
          (cd "$RUNNER_TEMP" && tar -xzf cargo-deny.tgz)
          "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-pc-windows-msvc/cargo-deny.exe" --locked check
      - name: Lints and unit tests (direct download, test hooks, Microsoft Store)
        working-directory: apps/desktop/src-tauri
        run: |
          locked=$([ -f Cargo.lock ] && echo --locked || true)
          cargo clippy $locked --all-targets -- -D warnings
          cargo clippy $locked --all-targets --features test-hooks -- -D warnings
          cargo clippy $locked --all-targets --features store -- -D warnings
          cargo test $locked
          cargo test $locked --features test-hooks
          cargo test $locked --features store
      - name: A release build has no test hooks
        working-directory: apps/desktop/src-tauri
        env:
          TTSNATIVE_TEST_HOOKS: ''
        run: |
          locked=$([ -f Cargo.lock ] && echo --locked || true)
          cargo build --release $locked
          # A plain cargo build keeps the crate's name; only `tauri build` renames it to TTSNative.exe.
          node ../../../scripts/desktop/check-test-hooks.mjs target/release/ttsnative-desktop.exe absent
      - name: Keep the lockfile and any formatting fix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shell-files
          path: |
            apps/desktop/src-tauri/Cargo.lock
            ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7

  installer:
    name: Windows installer (build and smoke test)
    runs-on: windows-2025
    timeout-minutes: 45 # catches a hung job; real runs take 10-21 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build identifier counts commits since the last release tag
      - uses: ./.github/actions/node-deps
      - uses: ./.github/actions/rust
        with:
          cache-name: installer
          runtime-cache: 'true'
          save: later
      - name: Build the installer (no updater key; never published)
        run: npm run desktop:build
      # Saved now rather than when the job ends, so a failing test below still leaves warm caches
      # for the next run (this job saves the cache the update job shares).
      - uses: ./.github/actions/rust
        with:
          cache-name: installer
          runtime-cache: 'true'
          save: now
      - name: Smoke test on this clean runner
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/desktop/smoke-test.mjs "dist/desktop/TTSNative-Setup-$version.exe" "$version"
      - name: Keeps documents, positions, bookmarks, settings and exports across a close and a crash
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/desktop/persistence-test.mjs --install "dist/desktop/TTSNative-Setup-$version.exe"
      - name: Refuses a silent install into a drive without room, before writing anything
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/desktop/space-test.mjs "dist/desktop/TTSNative-Setup-$version.exe"
      - name: Keep the app's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-logs
          path: ~/AppData/Local/com.ttsnative.desktop/logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the installer for manual testing
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttsnative-windows-installer
          path: dist/desktop/
          if-no-files-found: ignore
          retention-days: 14

  # The Microsoft Store package (ADR-26): the program with the `store` feature, packed by makeappx from
  # the runner's Windows SDK. A test identity until apps/desktop/store/identity.json holds Partner
  # Center's, so this package can be sideloaded for checks but never uploaded.
  store-package:
    name: Microsoft Store package (MSIX)
    runs-on: windows-2025
    timeout-minutes: 45 # catches a hung job; a run takes about as long as one update build
    env:
      TTSNATIVE_TEST_HOOKS: '' # the workflow's test builds need hooks; a Store package refuses them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version counts commits since the last release tag
      - uses: ./.github/actions/rust
        with:
          cache-name: installer
          runtime-cache: 'true'
          save: never # read-only: the installer job saves the cache
      - uses: ./.github/actions/node-deps
      - name: Build the Store package (no updater, no test hooks)
        run: npm run desktop:store
      - name: Keep the package for manual testing
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttsnative-store-package
          path: |
            dist/desktop/*.msix
            dist/desktop/*.msix.sha256
          if-no-files-found: ignore
          retention-days: 14

  # The update path in three steps, so versions A and B build at the same time: a throwaway key that
  # only this run's two test builds trust (passed between the jobs as a one-day artifact, never logged or
  # committed), the two builds, then the update test on their installers and signatures.
  update-key:
    name: Update path (throwaway key)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # catches a hung job; real runs take under a minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: npm run desktop:update-test -- --make-key "$RUNNER_TEMP/update-key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-key
          path: ${{ runner.temp }}/update-key/
          if-no-files-found: error
          retention-days: 1

  update-build:
    name: Update path (build ${{ matrix.label }})
    needs: update-key
    strategy:
      matrix:
        include:
          - { version: old, label: A }
          - { version: new, label: B }
    runs-on: windows-2025
    timeout-minutes: 45 # catches a hung job; real runs take 8-12 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - uses: ./.github/actions/rust
        with:
          cache-name: installer
          runtime-cache: 'true'
          save: never # the installer job saves the cache these jobs share
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-test-key
          path: ${{ runner.temp }}/update-key
      - name: Build ${{ matrix.label }} trusting the throwaway key
        run: npm run desktop:update-test -- --build ${{ matrix.version }} --key "$RUNNER_TEMP/update-key" --out "$RUNNER_TEMP/update-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-installer-${{ matrix.version }}
          path: ${{ runner.temp }}/update-build/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # the installer is already compressed

  update:
    name: Update path (verified update from A to B)
    needs: update-build
    runs-on: windows-2025
    timeout-minutes: 30 # catches a hung job; real runs take 6-8 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-test-installer-*
          path: ${{ runner.temp }}/update-build
          merge-multiple: true
      - name: Install A, refuse a bad and a broken update, then update to B (throwaway key)
        run: npm run desktop:update-test -- --test "$RUNNER_TEMP/update-build"
      - name: Keep the app's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-update-logs
          path: ~/AppData/Local/com.ttsnative.desktop/logs
          if-no-files-found: ignore
          retention-days: 7
