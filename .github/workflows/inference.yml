# Purpose: Heavyweight verification with real models: inference tests and Playwright journeys.
# Scope: Downloads the pinned Kokoro model (cached between runs by manifest hash), runs the
#   `inference` pytest marker and the Playwright suite in Chromium/Firefox/WebKit/mobile emulation.
#   The optional Chatterbox engine is not installed here (multi-GB); its UI path is still exercised.
# Does NOT belong: The fast PR gate (ci.yml).
name: Inference & E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LTTS_UV_PINNED_ONLY: '1'
      LTTS_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data/models
          key: models-${{ hashFiles('apps/server/src/ltts/modelstore/manifest.json') }}
      - run: npm ci
      - name: Bootstrap with the default model (SHA-256 verified)
        run: node scripts/setup.mjs
      - run: npm run test:inference
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
