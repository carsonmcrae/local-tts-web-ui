# Purpose: Publish the project website (site/) with the overview and demo videos to GitHub Pages.
# Scope: Copies site/ and the videos, posters, captions and social image from docs/media into one folder
#   and deploys it with GitHub's official Pages actions (SHA-pinned). Runs when the site or media change
#   on main, or on demand.
# Does NOT belong: The wiki (wiki.yml) or release packaging (release.yml).
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/media/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -R site/. _site/
          cp docs/media/*.mp4 docs/media/*.webp docs/media/*.vtt docs/media/social-preview.png _site/media/
          ls -la _site _site/media
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
