# Purpose: Publish the TTSNative website (site/) to GitHub Pages.
# Scope: Assembles the site with scripts/site/build-site.mjs (videos, screenshots, sitemap, robots.txt and
#   a broken-link check), using the address Pages reports as the base URL, so canonical and social links
#   follow a custom domain automatically; asks GitHub which releases are published so the Windows download
#   (only when a published installer's link answers) and the release history show approved releases only;
#   deploys with GitHub's official Pages actions (SHA-pinned). Runs when the site, media, screenshots,
#   brand or release notes change on main, on demand, and after every release (release.yml starts it).
# Does NOT belong: The wiki (wiki.yml) or release packaging (release.yml).
name: Pages

on:
  push:
    branches: [main]
    paths:
      [
        'site/**',
        'docs/media/**',
        'docs/images/**',
        'scripts/site/**',
        'scripts/lib/releases.mjs',
        'docs/releases/**',
        '.github/workflows/pages.yml',
      ]
  workflow_dispatch:
    inputs:
      expect_installer:
        description: 'Fail unless this version has a published Windows installer (set by the release workflow)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECT_INSTALLER: ${{ inputs.expect_installer }}
        run: |
          node scripts/site/build-site.mjs --out _site --base-url "$BASE_URL" --releases github \
            ${EXPECT_INSTALLER:+--expect-installer "$EXPECT_INSTALLER"}
          ls -la _site _site/media
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
