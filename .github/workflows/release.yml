# Purpose: Publish a verified GitHub Release when the maintainer pushes a version tag (vX.Y.Z).
# Scope: Refuses a tag that isn't on main, doesn't match the version files, has unconsumed change files,
#   lacks finished user-facing notes (docs/releases/X.Y.Z.md) or a dated CHANGELOG entry, was already
#   published, or whose commit fails the readiness gate (scripts/release/gate.mjs: CI, Desktop, CodeQL
#   and the browser journeys passed on it, SonarQube's result recorded for it at the project's policy,
#   the previous release published from its release commit and checked after publishing, every check
#   before release done, none after publishing marked early, no blocker open); runs the full check
#   suite; builds the Windows installer signed for updates (and with Authenticode when its secrets
#   exist), proves the update signature matches the app's public key and
#   smoke-tests the installer on a clean runner; packages the source, the prebuilt web UI, the
#   corresponding source of the installer's GPL/LGPL parts, SBOMs and
#   SHA256SUMS.txt with signed build provenance; creates the release as a draft, uploads everything,
#   and only then makes it public and Latest (an incomplete release is never visible); finally asks
#   the Pages workflow to refresh ttsnative.com.
# Does NOT belong: Everyday CI (ci.yml), desktop builds for testing (desktop.yml) or real-model tests
#   (inference.yml).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish again (only tags that include the Windows app)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  LTTS_SKIP_MODEL_DOWNLOAD: '1'
  LTTS_UV_PINNED_ONLY: '1'
  LTTS_NO_OPEN: '1'
  UV_LINK_MODE: copy
  TAG: ${{ inputs.tag || github.ref_name }}
  # A release build never has the test hooks (build.mjs refuses and checks the binary).
  TTSNATIVE_TEST_HOOKS: ''

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify, check and package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the readiness gate reads which workflows passed on the release commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - name: The tag is on main, new, and matches the version, changes and finished notes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          if [ "$EVENT" = push ] && gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -qx false; then
            echo "::error::$TAG is already published; versions are never reused"; exit 1
          fi
          node scripts/check-version.mjs
          node scripts/check-changes.mjs
          pending=$(find .changes -name '*.md' ! -name README.md | wc -l)
          [ "$pending" -eq 0 ] || { echo "::error::$pending change files were not consumed by release:prepare"; exit 1; }
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: The release environment exists and waits for a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: without the environment the signing job would run unprotected and unsigned.
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]?.type] | join(",")') \
            || { echo "::error::The 'release' environment is missing or unreadable (Settings → Environments); see docs/guides/release-process.md"; exit 1; }
          echo "$rules" | grep -q required_reviewers \
            || { echo "::error::The 'release' environment has no required reviewer, so a release build would start without a person approving it"; exit 1; }
      - name: The release commit passed its own readiness gate (workflows, SonarQube, acceptance)
        env:
          GH_TOKEN: ${{ github.token }}
        # Individual pull requests passing isn't enough: the combined commit must pass as a whole.
        run: node scripts/release/gate.mjs "${TAG#v}" --commit "$(git rev-list -n 1 "$TAG")"
      - name: Bootstrap (verified uv download, Python 3.12, locked deps)
        run: node scripts/setup.mjs
      - run: npm run check
      - name: Package release files
        run: |
          version="${TAG#v}"
          out=release-files
          mkdir -p "$out"
          git archive --format=tar.gz --prefix="ttsnative-$version/" -o "$out/ttsnative-$version-source.tar.gz" "$TAG"
          # The prebuilt UI travels with the project's own licence (third-party notices are already in dist).
          cp LICENSE apps/web/dist/LICENSE
          tar -czf "$out/ttsnative-$version-web-ui.tar.gz" -C apps/web dist
          npm sbom --omit dev --sbom-format cyclonedx > "$out/sbom-web.cdx.json"
          node scripts/uv-run.mjs --cwd apps/server export --frozen --no-dev --format cyclonedx1.5 -o "../../$out/sbom-server.cdx.json" --quiet
          node scripts/uv-run.mjs --cwd apps/chatterbox-worker export --frozen --no-dev --extra cpu --format cyclonedx1.5 -o "../../$out/sbom-chatterbox-worker.cdx.json" --quiet
          cp docs/media/ttsnative-demo.mp4 docs/media/ttsnative-promo.mp4 "$out/"
          cp "$RUNNER_TEMP/release-notes.md" "$out/release-notes.md"
          # Corresponding source for the GPL/LGPL parts of the Windows installer (verified against the manifest).
          node scripts/release/third-party-sources.mjs "$version" "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-common
          path: release-files/
          retention-days: 7

  windows:
    name: Windows installer (signed, smoke-tested)
    needs: verify
    runs-on: windows-2025
    # Holds the updater signing key; add required reviewers to this environment so a person approves
    # every release build (Settings → Environments → release).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - uses: ./.github/actions/rust
        with:
          cache-name: release
          # A release downloads and verifies the bundled Python and models afresh, never from a cache.
          runtime-cache: 'false'
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode is optional until a certificate exists (docs/guides/release-process.md).
          TTSNATIVE_WINDOWS_SIGN_COMMAND: ${{ vars.TTSNATIVE_WINDOWS_SIGN_COMMAND }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing from the release environment"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo "::error::The TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is missing from the release environment"; exit 1; }
          [ -z "$TTSNATIVE_TEST_HOOKS" ] || { echo "::error::TTSNATIVE_TEST_HOOKS is set; a release build must not contain the test hooks"; exit 1; }
          npm run desktop:build
          version=$(cat dist/desktop/version.txt)
          [ "v$version" = "$TAG" ] || { echo "::error::built $version, expected $TAG"; exit 1; }
      - name: The update signature matches the key built into the app
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/release/verify-update-signature.mjs "dist/desktop/TTSNative-Setup-$version.exe"
      - name: Smoke test on this clean runner
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/desktop/smoke-test.mjs "dist/desktop/TTSNative-Setup-$version.exe" "$version"
      - name: Updater manifest and SBOM
        run: |
          version=$(cat dist/desktop/version.txt)
          node scripts/release/updater-manifest.mjs "$version" "dist/desktop/TTSNative-Setup-$version.exe.sig" dist/desktop/latest.json
          cargo install cargo-cyclonedx --version 0.5.9 --locked --quiet
          (cd apps/desktop/src-tauri && cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom-desktop-shell.cdx)
          mv apps/desktop/src-tauri/sbom-desktop-shell.cdx.json dist/desktop/
          rm -f dist/desktop/version.txt dist/desktop/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/desktop/
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [verify, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write # to start the Pages workflow afterwards
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        run: |
          cd release-files
          mv release-notes.md "$RUNNER_TEMP/release-notes.md"
          sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
      - name: Publish (as a draft until every file is attached)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "TTSNative $version" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "TTSNative $version" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" release-files/*
          fi
          for file in latest.json "TTSNative-Setup-$version.exe" "TTSNative-Setup-$version.exe.sig" SHA256SUMS.txt "ttsnative-$version-third-party-sources.tar.gz"; do
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$file" || { echo "::error::$file is missing"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
      - name: Refresh ttsnative.com
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main -f expect_installer="${TAG#v}"
