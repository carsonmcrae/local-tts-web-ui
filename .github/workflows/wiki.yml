# Purpose: Publish docs/wiki/ to the repository's GitHub wiki whenever it changes on main.
# Scope: The wiki's source lives in the repository so it is reviewed in pull requests like code. This job
#   mirrors docs/wiki/*.md into the wiki repository (adding, updating and removing pages) and pushes
#   only when something changed. Uses the job's own token; no third-party actions.
# Does NOT belong: Technical reference docs (docs/), which stay in the repository.
name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror docs/wiki into the wiki repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          find "$RUNNER_TEMP/wiki" -mindepth 1 -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi
