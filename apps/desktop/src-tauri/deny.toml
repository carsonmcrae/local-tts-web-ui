# Purpose: Supply-chain policy for the desktop shell's Rust crates, enforced by cargo-deny in CI.
# Scope: Only what the Windows app compiles (Linux and macOS crates in Cargo.lock are out of scope):
#   no crate with a RustSec advisory (vulnerable, unsound or unmaintained) or a yanked version,
#   only permissive or weak-copyleft licences reviewed for binary redistribution, and crates only from
#   crates.io.
# Does NOT belong: The 14-day cool-down (scripts/desktop/cargo-cooldown.mjs) or direct pins (Cargo.toml).

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Only the licences the Windows build actually contains. MPL-2.0 is file-level copyleft: shipping
# compiled, unmodified crates needs the licence notice and a pointer to the source (crates.io).
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
