# Purpose: Python package definition, locked dependency policy and tool configuration for the
#   local API server (package `ltts`).
# Scope: Runtime and dev dependencies, the `ltts` CLI entry point, ruff/mypy/pytest/coverage settings.
# Does NOT belong: The optional voice-cloning engine's dependencies, which live in an isolated
#   project (apps/chatterbox-worker) because they conflict with this environment.

[project]
name = "ltts"
version = "2.1.0"
description = "Local-first text-to-speech reader: document extraction, Kokoro synthesis and voice studio API."
readme = "README.md"
license = "MIT"
authors = [{ name = "Carson McRae" }]
requires-python = ">=3.12.4,<3.13"  # ipaddress misclassifies some private ranges before 3.12.4 (CVE-2024-4032)
dependencies = [
  "fastapi>=0.142,<1",
  "starlette>=1.7,<2",  # imported directly: errors.py handles its base HTTPException
  "uvicorn>=0.54,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "soundfile>=0.14,<1",
  "kokoro-onnx>=0.6.1,<0.7",
  "onnxruntime>=1.22,<2",
  "pypdfium2>=5.14,<6",
  "python-docx>=1.2,<2",
  "defusedxml>=0.7.1,<0.8",
  "markdown-it-py>=4.2,<5",
  "psutil>=7.2,<8",
  "segno>=1.6.6,<2",
]

[project.urls]
Homepage = "https://github.com/carsonmcrae/ttsnative"
Source = "https://github.com/carsonmcrae/ttsnative"

[project.scripts]
ltts = "ltts.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
  "mypy>=2.4,<3",
  "pip-audit>=2.10,<3",
  "deptry>=0.25,<0.26",
  "watchfiles>=1.3,<2",
  "types-psutil",
  "types-defusedxml",
  # Starlette's TestClient prefers httpx2 and deprecates running on httpx (the app itself keeps httpx).
  "httpx2>=2.13,<3",
  # Runs the tests on several CPUs at once (four on CI runners); the suite takes less than half as long.
  "pytest-xdist>=3.8,<4",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltts"]

[tool.uv]
# Supply-chain cool-down: only resolve releases that have been public for at least two weeks.
exclude-newer = "14 days"
# Security exception: certifi 2026.10.19 fixes GHSA-6q48-6c7w-9gw2 and is newer than the window. Drop this
# after 2026-11-03, when the 14-day window covers it.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "PL", "RUF", "SIM", "PTH", "N", "ASYNC", "BLE", "T20", "RET", "ARG"]
ignore = [
  "PLR2004", # magic values in comparisons are handled by named constants where they carry meaning
  "PLC0415", # local imports are used deliberately to keep optional/heavy modules lazy
  "RUF001",  # user-facing copy intentionally uses typographic punctuation (en dashes, curly quotes)
  "RUF002",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PLR0917", "ARG001", "ARG002", "ARG005", "PLR2004", "T201", "E501"]
"src/ltts/cli.py" = ["T201"]            # the CLI's job is printing to the terminal
"src/ltts/*/router.py" = ["PLR0913", "PLR0917"]  # FastAPI injects many parameters into routes

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ltts"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "pypdfium2.*", "docx.*", "soundfile.*", "onnxruntime.*", "markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default, at most eight workers; worksteal evens out the few multi-second tests. `-n 0` runs serially.
addopts = "-ra --strict-markers -m 'not inference' -n logical --maxprocesses=8 --dist worksteal"
markers = [
  "inference: runs real model inference (needs installed model files; run with `npm run test:inference`)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["ltts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "if __name__ == .__main__.:"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "onnxruntime"]
