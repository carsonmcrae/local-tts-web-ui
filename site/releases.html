<!doctype html>
<!--
  Purpose: The website's release history: what changed in each published version of TTSNative, one
    version at a time.
  Scope: A page shell the build (scripts/site/build-site.mjs) fills from docs/releases/: releases.html
    shows the latest version, and every version gets its own page at releases/<version>/, each with
    the list of versions, the notes and their date, and Older / Newer links. The Windows download
    appears when one exists. Links are absolute (%BASE_URL%) so the same shell works at any depth.
  Does NOT belong: The notes themselves (docs/releases/) or the home page (index.html).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <link rel="canonical" href="%PAGE_URL%" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="TTSNative" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:url" content="%PAGE_URL%" />
    <!-- head:shared -->
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main" class="wrap releases">
      <p class="eyebrow"><a href="%BASE_URL%/">TTSNative</a></p>
      <h1>Release history</h1>
      <p class="lead">What changed in each version of TTSNative, and when it came out.</p>
      <!-- if:download -->
      <p class="actions">
        <a class="btn primary" href="%WIN_URL%">Download TTSNative %WIN_VERSION% for Windows</a>
        <a class="btn" href="%BASE_URL%/#download">Installation and requirements</a>
      </p>
      <!-- /if:download -->
      <!-- release-history -->
      <p class="fine">
        Developer details for every version are in the
        <a href="https://github.com/carsonmcrae/ttsnative/blob/main/CHANGELOG.md">changelog</a>.
      </p>
    </main>
  </body>
</html>
