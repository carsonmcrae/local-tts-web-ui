# Purpose: SonarQube analysis settings for the local code-quality scan (npm run sonar).
# Scope: The project identity and local server, what is analysed as source and as tests, what is
#   excluded (dependencies, build output, generated and fixture files), the coverage reports imported
#   (Vitest lcov for the web app, pytest XML for the server) and the files outside the coverage
#   contract. The token is never stored here: the scanner reads SONAR_TOKEN from the environment.
# Does NOT belong: The coverage contract itself (apps/web/vite.config.ts, apps/server/pyproject.toml)
#   or the repository gates SonarQube does not replace (npm run check).

sonar.projectKey=local-tts-web-ui
sonar.projectName=Local TTS
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8
sonar.working.directory=.tools/sonar/.scannerwork

# Source: the web app, the server, the cloning worker, the scripts, the CI definitions and the site.
sonar.sources=apps/web/src,apps/server/src,apps/chatterbox-worker/src,scripts,.github,site,eslint.config.mjs,playwright.config.ts,apps/web/vite.config.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,apps/web/src/api/schema.gen.ts,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/test/**,site/fonts/**

# Tests: Vitest (beside the web sources and in src/test), pytest and the Playwright journeys.
sonar.tests=apps/web/src,apps/server/tests,tests
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/test/**,apps/server/tests/**,tests/e2e/**,tests/perf/**
sonar.test.exclusions=tests/fixtures/**

# Coverage reports (npm run sonar:coverage writes both).
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.python.coverage.reportPaths=apps/server/coverage.xml
sonar.python.version=3.11,3.12

# Outside the coverage contract: tooling and definitions that unit tests don't execute. The scripts
# are exercised by CI and the real bootstrap; the cloning worker runs only in its own environment and
# is exercised by the real-model tests (npm run test:inference).
sonar.coverage.exclusions=scripts/**,.github/**,site/**,eslint.config.mjs,playwright.config.ts,apps/web/vite.config.ts,apps/web/src/main.tsx,apps/chatterbox-worker/**

# TypeScript projects (listed so session worktrees under .claude/ are never picked up).
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,scripts/tsconfig.json,tests/e2e/tsconfig.json
